# Starter configuration for a minimal dual-tone Kitty terminal.
# Adapt as needed for your own workspace and hardware.

font_family      monospace
font_size        11.0
cursor_shape     block
cursor_blink_interval 0
enable_audio_bell no
window_padding_width 8
background_opacity 1.0
hide_window_decorations no
remember_window_size yes
initial_window_width 100c
initial_window_height 30c

# Minimal dual-tone palette
foreground            #171717
background            #F5F5F5
selection_foreground  #F5F5F5
selection_background  #171717
cursor                #171717
color0                #171717
color1                #454545
color2                #676767
color3                #8A8A8A
color4                #B1B1B1
color5                #D3D3D3
color6                #E6E6E6
color7                #F5F5F5
color8                #171717
color9                #2F2F2F
color10               #4D4D4D
color11               #707070
color12               #949494
color13               #B8B8B8
color14               #DCDCDC
color15               #F5F5F5

# Optional transparency and tabs
# background_opacity 0.96
# tab_bar_style powerline
# active_tab_foreground #F5F5F5
# active_tab_background #171717
# inactive_tab_foreground #171717
# inactive_tab_background #DCDCDC

# For a dark variant, swap to a charcoal background and soft white foreground.
# background = #171717
# foreground = #F5F5F5
# selection_foreground = #171717
# selection_background = #F5F5F5
